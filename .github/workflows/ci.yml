name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CandyBot.sln

      - name: Build
        run: dotnet build CandyBot.sln --configuration Release --no-restore

      # MySql-tagged tests require Docker/Testcontainers and are excluded here.
      # They run in the separate `mysql-tests` job below.
      - name: Test
        run: dotnet test CandyBot.sln --configuration Release --no-build --filter "Category!=MySql" --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  # 单独的 MySQL 集成测试任务，避免容器启动时间拖慢快速的 build 任务。
  # 该任务需要 Docker 来运行 Testcontainers——GitHub 托管的 ubuntu runner 自带 Docker，
  # Testcontainers 会自行拉起 / 销毁 MySQL 容器，无需 services: 块。
  mysql-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CandyBot.sln

      - name: Build
        run: dotnet build CandyBot.sln --configuration Release --no-restore

      - name: Test (MySql)
        run: dotnet test CandyBot.sln --configuration Release --no-build --filter "Category=MySql" --logger trx --results-directory TestResults-MySql

      - name: Upload MySql test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-test-results
          path: TestResults-MySql
